[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cliparab-core"
version = "0.1.0"
description = "ClipArab core: transcript analysis, ClipScore, reframing, Arabic captions and FFmpeg rendering"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0.3"]
vision = ["opencv-python-headless>=4.9"]
diarization = ["pyannote.audio>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
cliparab = "cliparab_core.cli:main"

[tool.setuptools.packages.find]
include = ["cliparab_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
